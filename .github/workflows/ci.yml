name: prototype-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static prototype smoke
        run: python scripts/smoke_static.py
      - name: Reject conflict markers
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . --exclude-dir=.git; then
            exit 1
          fi
